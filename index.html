<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Retro Snake Game</title>
<style>
  body {
    display: flex;
    justify-content: center;
    align-items: center;
    height: 100vh;
    margin: 0;
    background-color: #121212;
    color: white;
    font-family: 'Arial', sans-serif;
  }

  canvas {
    border: 5px solid #ff0000;
    box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
    background-color: #1f1f1f;
  }
</style>
<script>
  const canvas = document.createElement('canvas');
  const ctx = canvas.getContext('2d');

  let snakeLength = 5;
  let score = 0;

  const directions = {
    left: [-1, 0],
    right: [1, 0],
    up: [0, -1],
    down: [0, 1]
  };

  let currentDirection = 'right';

  function drawSnake() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let i = 0; i < snakeLength; i++) {
      ctx.fillStyle = '#ff0000';
      ctx.fillRect(snake[i][0], snake[i][1], 20, 20);
    }
  }

  function moveSnake() {
    const [dx, dy] = directions[currentDirection];
    for (let i = snake.length - 2; i >= 0; i--) {
      snake[i + 1][0] = snake[i][0];
      snake[i + 1][1] = snake[i][1];
    }
    snake[0][0] += dx;
    snake[0][1] += dy;

    if (snake[0][0] < 0) {
      snake[0][0] = canvas.width - 20;
    } else if (snake[0][0] >= canvas.width) {
      snake[0][0] = 0;
    }

    if (snake[0][1] < 0) {
      snake[0][1] = canvas.height - 20;
    } else if (snake[0][1] >= canvas.height) {
      snake[0][1] = 0;
    }
  }

  function checkCollision() {
    for (let i = 1; i < snake.length; i++) {
      if (snake[i][0] === snake[0][0] && snake[i][1] === snake[0][1]) {
        return true;
      }
    }
    return false;
  }

  function checkFood() {
    for (let i = 0; i < food.length; i++) {
      if (
        snake[0][0] === food[i][0] &&
        snake[0][1] === food[i][1]
      ) {
        score++;
        food.splice(i, 1);
        snakeLength++;
        return true;
      }
    }
    return false;
  }

  function gameLoop() {
    moveSnake();
    if (checkCollision()) {
      clearInterval(gameInterval);
      alert(`Game Over! Your score: ${score}`);
    } else if (checkFood()) {
      drawSnake();
      ctx.fillStyle = '#00ff00';
      ctx.fillRect(food[0][0], food[0][1], 20, 20);
    }
    requestAnimationFrame(gameLoop);
  }

  function init() {
    canvas.width = window.innerWidth - 40;
    canvas.height = window.innerHeight - 40;

    snake = [];
    for (let i = 0; i < snakeLength; i++) {
      snake.push([Math.floor(canvas.width / 2) - i, Math.floor(canvas.height / 2)]);
    }

    food = [generateRandomFood()];

    gameInterval = setInterval(gameLoop, 100);
  }

  function generateRandomFood() {
    const x = Math.floor(Math.random() * (canvas.width / 20)) * 20;
    const y = Math.floor(Math.random() * (canvas.height / 20)) * 20;

    while (x === snake[0][0] && y === snake[0][1]) {
      x = Math.floor(Math.random() * (canvas.width / 20)) * 20;
      y = Math.floor(Math.random() * (canvas.height / 20)) * 20;
    }

    return [x, y];
  }

  window.addEventListener('keydown', (e) => {
    if (e.key === 'ArrowLeft' && currentDirection !== 'right') {
      currentDirection = 'left';
    } else if (e.key === 'ArrowRight' && currentDirection !== 'left') {
      currentDirection = 'right';
    } else if (e.key === 'ArrowUp' && currentDirection !== 'down') {
      currentDirection = 'up';
    } else if (e.key === 'ArrowDown' && currentDirection !== 'up') {
      currentDirection = 'down';
    }
  });

  window.addEventListener('resize', () => {
    canvas.width = window.innerWidth - 40;
    canvas.height = window.innerHeight - 40;
  });

  init();
</script>
</head>
<body>
<canvas id="gameCanvas"></canvas>
</body>
</html>
